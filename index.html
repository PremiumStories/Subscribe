<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ಪೇಮೆಂಟ್ ಮಾಡಿ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#f4f7fb;color:#12203a;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center}
h1{font-size:1.3rem;margin:0 0 4px}
p{color:#5b6b86;margin:4px 0 16px;font-size:.95rem}
.amt{font-size:2.2rem;font-weight:700}
a.pay{display:block;margin-top:14px;background:#0b2e6f;color:#fff;text-decoration:none;padding:14px;border-radius:10px;font-size:1.1rem;font-weight:600}
button{margin-top:12px;background:none;border:1px solid #dbe3ef;padding:10px;border-radius:10px;width:100%;font-size:.95rem}
.id{font-family:monospace;font-size:.9rem;margin-top:16px;color:#5b6b86}
</style>
</head>
<body>
<div class="card">
<h1>ಪೇಮೆಂಟ್ ಮಾಡಿ</h1>
<p>ಮೊತ್ತ</p>
<div class="amt">₹199</div>
<a id="go" class="pay" href="#" target="_top">UPI ಆ್ಯಪ್ ನಲ್ಲಿ ಪೇ ಮಾಡಿ</a>
<button id="copy">UPI ID ಕಾಪಿ ಮಾಡಿ</button>
<div class="id">paytm.s1a25ou@pty</div>
</div>
<script>
var PA="paytm.s1a25ou@pty",PN="Merchant";
var go=document.getElementById("go");
var q="pa="+encodeURIComponent(PA)+"&pn="+encodeURIComponent(PN)+"&am=199.00&cu=INR";
if(/Android/i.test(navigator.userAgent)){go.href="intent://pay?"+q+"#Intent;scheme=upi;end;";}else{go.href="upi://pay?"+q;}
var tg=window.Telegram&&window.Telegram.WebApp;
var inTG=tg&&tg.initData;
if(inTG){
  tg.ready();tg.expand();
  go.addEventListener("click",function(e){
    e.preventDefault();
    tg.openLink(location.origin+location.pathname+"?ext=1");
  });
}
document.getElementById("copy").addEventListener("click",function(e){
  try{navigator.clipboard.writeText(PA);e.target.textContent="ಕಾಪಿ ಆಯ್ತು ✓";}catch(x){e.target.textContent=PA;}
});
</script>
</body>
</html>
